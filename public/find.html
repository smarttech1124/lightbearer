<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find my ticket — Light Bearers Picnic</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/"><img src="/assets/logo.png" alt="Light Bearers"><span class="brand-txt"><b>Light Bearers</b><small>Picnic Hangout</small></span></a>
      <nav class="nav-links"><a class="btn btn-ghost btn-sm" href="/">Home</a></nav>
    </div>
  </header>
  <main class="section">
    <div class="container container-narrow">
      <div class="section-head"><span class="kicker">Lookup</span><h2>Find my ticket</h2><p>Enter your reference number and email to view your ticket and payment status.</p></div>
      <div class="card card-pad" style="max-width:480px;margin:0 auto">
        <form id="find-form" novalidate>
          <div class="field">
            <label for="reference">Registration reference</label>
            <input class="input" type="text" id="reference" placeholder="e.g. LB26-ABCDE" style="text-transform:uppercase" required>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input class="input" type="email" id="email" placeholder="you@example.com" required>
          </div>
          <button class="btn btn-gold btn-block" type="submit" id="find-btn"><span class="btn-label">Find my ticket</span></button>
        </form>
      </div>
    </div>
  </main>
  <div class="toast-wrap" id="toast-wrap"></div>
  <script src="/js/common.js"></script>
  <script src="/js/find.js"></script>
</body>
</html>
