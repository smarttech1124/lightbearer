<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in — Light Bearers Picnic</title>
  <meta name="theme-color" content="#0b1437">
  <link rel="icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/"><img src="/assets/logo.png" alt="Light Bearers"><span class="brand-txt"><b>Light Bearers</b><small>Gate Check-in</small></span></a>
      <nav class="nav-links"><a class="btn btn-ghost btn-sm" href="/admin">Dashboard</a></nav>
    </div>
  </header>

  <main class="ticket-page">
    <div class="container ticket">
      <div id="loading" style="text-align:center;padding:4rem 0;color:var(--muted)">
        <span class="spinner spinner-navy" style="width:28px;height:28px;margin:0 auto 1rem"></span>
        <p>Verifying…</p>
      </div>

      <div id="need-login" class="util-hidden card card-pad" style="text-align:center">
        <div style="font-size:2rem">🔒</div>
        <h2 style="font-size:1.4rem">Staff sign-in required</h2>
        <p class="text-muted">Please sign in as an administrator or gate staff to check this participant in.</p>
        <a class="btn btn-navy" id="login-link" href="/admin" style="margin-top:1rem">Go to sign in</a>
      </div>

      <div id="result" class="util-hidden"></div>
    </div>
  </main>

  <div class="toast-wrap" id="toast-wrap"></div>
  <script src="/js/common.js"></script>
  <script src="/js/verify.js"></script>
</body>
</html>
